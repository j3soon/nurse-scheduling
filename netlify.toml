[build]
  publish = "web-frontend/out"
  command = """
  set -e
  rm -rf web-frontend/out
  rm -rf site

  cd web-frontend
  bun ci
  bun run build
  cd ..

  pip install -r docs/requirements.txt
  python -m zensical build --clean --strict

  mkdir -p web-frontend/out/docs
  mv site/* web-frontend/out/docs/
  """

[build.environment]
  # Configure frontend Sentry variables in Netlify's Build-scoped environment.
  # See README.md#hosting-on-netlify. Keep SENTRY_AUTH_TOKEN out of this file.
  NODE_VERSION = "25"
  PYTHON_VERSION = "3.12"
