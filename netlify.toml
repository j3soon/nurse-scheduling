[build]
  publish = "web-frontend/out"
  command = """
  set -e
  rm -rf web-frontend/out
  rm -rf site

  cd web-frontend
  bun ci
  bun run build
  cd ..

  pip install -r docs/requirements.txt
  python -m zensical build --clean --strict

  mkdir -p web-frontend/out/docs
  mv site/* web-frontend/out/docs/
  """

[build.environment]
  # Configure frontend Sentry variables in Netlify's Build-scoped environment.
  # See web-frontend/README.md#hosting-on-netlify. Keep SENTRY_AUTH_TOKEN out of this file.
  NODE_VERSION = "25"
  PYTHON_VERSION = "3.12"

# Redirect docs pages that moved into the nav hierarchy to their new paths.
# Keep in step with zensical.toml and docs/AGENTS.md path rules.

[[redirects]]
  from = "/docs/backend-server/*"
  to = "/docs/developer-guide/backend-server/:splat"
  status = 301

[[redirects]]
  from = "/docs/ai-assistant/*"
  to = "/docs/developer-guide/ai-assistant/:splat"
  status = 301

[[redirects]]
  from = "/docs/solvers/*"
  to = "/docs/developer-guide/solvers/:splat"
  status = 301

[[redirects]]
  from = "/docs/design/*"
  to = "/docs/developer-guide/design/:splat"
  status = 301

[[redirects]]
  from = "/docs/developer-guide/reproduce/deploy/*"
  to = "/docs/developer-guide/backend-deployment/:splat"
  status = 301
