name: ${COMPOSE_PROJECT_NAME:-nurse-scheduling-backend}

x-api-build: &api-build
  context: ${API_BUILD_CONTEXT:-.}
  dockerfile: ${API_DOCKERFILE:-Dockerfile.api}

services:
  redis:
    image: redis:8.8
    restart: unless-stopped
    # Keep the image's default RDB policy; deployments needing a smaller
    # crash-loss window can enable AOF as described in docker/README.md.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      # Docker's default interval waits too long during startup.
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    image: ${COMPOSE_PROJECT_NAME:-nurse-scheduling-backend}-api:local
    build: *api-build
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      JOB_BACKEND: redis
      JOB_REDIS_URL: redis://redis:6379/0
      JOB_REDIS_KEY_PREFIX: nurse_scheduling:jobs:v0
    command:
      - uvicorn
      - nurse_scheduling.serve:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "3"
      - --no-access-log
    expose:
      - "8000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      # Docker's default interval waits too long during startup.
      interval: 3s
      timeout: 3s
      retries: 30

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}

  diagnostic:
    profiles: ["diagnostic"]
    image: ${COMPOSE_PROJECT_NAME:-nurse-scheduling-backend}-api:local
    build: *api-build
    restart: "no"
    depends_on:
      cloudflared:
        condition: service_started
    environment:
      DIAGNOSTIC_TARGET_URL: ${DIAGNOSTIC_TARGET_URL:-https://api.nursescheduling.org}
      DIAGNOSTIC_INFO_SAMPLES: ${DIAGNOSTIC_INFO_SAMPLES:-100}
      DIAGNOSTIC_PARALLEL_REQUESTS: ${DIAGNOSTIC_PARALLEL_REQUESTS:-10}
      DIAGNOSTIC_EXPECTED_CONCURRENCY: ${DIAGNOSTIC_EXPECTED_CONCURRENCY:-3}
      DIAGNOSTIC_MAX_JOBS: ${DIAGNOSTIC_MAX_JOBS:-128}
      DIAGNOSTIC_QUEUE_STABLE_SECONDS: ${DIAGNOSTIC_QUEUE_STABLE_SECONDS:-10}
      DIAGNOSTIC_WORKFLOW_TIMEOUT_SECONDS: ${DIAGNOSTIC_WORKFLOW_TIMEOUT_SECONDS:-600}
      DIAGNOSTIC_JOB_TIMEOUT_SECONDS: ${DIAGNOSTIC_JOB_TIMEOUT_SECONDS:-3600}
      DIAGNOSTIC_REPORT_DIR: /reports
    command: ["python", "-m", "nurse_scheduling.server.diagnostic"]
    volumes:
      - diagnostic-reports:/reports

volumes:
  redis-data:
  diagnostic-reports:
