events {}

http {
    server {
        listen 8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        # Let each service answer its own oversize request with JSON instead of
        # letting NGINX's 1 MB default reject it as HTML. Keep these above the
        # limits the services advertise, and raise them together.
        client_max_body_size 4m;
        # AI requests may be silent for longer than NGINX's default 60 seconds.
        # Stay above AI_SANDBOX_TURN_TIMEOUT_SECONDS so a turn that runs out of
        # time reports its own error instead of losing the connection first.
        proxy_read_timeout 3660s;

        location /ai/ {
            # Above AI_MAX_ATTACHMENT_FILES * AI_MAX_ATTACHMENT_BYTES plus
            # AI_MAX_SCHEDULE_BYTES, the message, and multipart overhead.
            client_max_body_size 48m;
            proxy_pass http://ai:8001/;
        }

        location / {
            # Above OPTIMIZE_MAX_YAML_BYTES plus multipart overhead.
            proxy_pass http://api:8000;
        }
    }
}
