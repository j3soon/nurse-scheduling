events {}

http {
    server {
        listen 8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        # AI requests may be silent for longer than NGINX's default 60 seconds.
        proxy_read_timeout 3600s;

        location /ai/ {
            # Eight 5 MB attachments plus multipart overhead fit below 40 MiB.
            client_max_body_size 40m;
            proxy_pass http://ai:8001/;
        }

        location / {
            proxy_pass http://api:8000;
        }
    }
}
