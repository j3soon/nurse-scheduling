name: ${COMPOSE_PROJECT_NAME:-nurse-scheduling-backend}

x-api-build: &api-build
  context: ${API_BUILD_CONTEXT:-.}
  dockerfile: ${API_DOCKERFILE:-Dockerfile.api}
  args:
    - APP_VERSION

x-sentry-environment: &sentry-environment
  SENTRY_DSN: "${SENTRY_BACKEND_DSN:-}"
  SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-production}"
  DISABLE_SENTRY: "${DISABLE_SENTRY:-}"

services:
  api:
    image: ${COMPOSE_PROJECT_NAME:-nurse-scheduling-backend}-api:local
    build: *api-build
    restart: unless-stopped
    environment:
      <<: *sentry-environment
      JOB_BACKEND: memory
      OPTIMIZE_SOLVERS: "${OPTIMIZE_SOLVERS:-ortools/cp-sat}"
      OPTIMIZE_DEFAULT_SOLVER: "${OPTIMIZE_DEFAULT_SOLVER:-ortools/cp-sat}"
      OPTIMIZE_MIN_TIMEOUT_SECONDS: "${OPTIMIZE_MIN_TIMEOUT_SECONDS:-1}"
      OPTIMIZE_DEFAULT_TIMEOUT_SECONDS: "${OPTIMIZE_DEFAULT_TIMEOUT_SECONDS:-300}"
      OPTIMIZE_MAX_TIMEOUT_SECONDS: "${OPTIMIZE_MAX_TIMEOUT_SECONDS:-3600}"
      OPTIMIZE_DEFAULT_PRETTIFY: "${OPTIMIZE_DEFAULT_PRETTIFY:-true}"
      # The production image enables authentication, so this deployment refuses to start
      # without a token. Serving it open needs a deliberate API_AUTH_REQUIRED=false.
      API_AUTH_REQUIRED: "${API_AUTH_REQUIRED:-true}"
      API_AUTH_TOKEN: "${API_AUTH_TOKEN:-}"
      CLAIMED_PERFORMANCE_SCORE: "${CLAIMED_PERFORMANCE_SCORE:-}"
      CLAIMED_PERFORMANCE_APP_VERSION: "${CLAIMED_PERFORMANCE_APP_VERSION:-}"
      CLAIMED_PERFORMANCE_MEASURED_AT: "${CLAIMED_PERFORMANCE_MEASURED_AT:-}"
    expose:
      - "8000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      # Docker's default interval waits too long during startup.
      interval: 3s
      timeout: 3s
      retries: 30

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}

  diagnostic:
    profiles: ["diagnostic"]
    image: ${COMPOSE_PROJECT_NAME:-nurse-scheduling-backend}-api:local
    build: *api-build
    restart: "no"
    depends_on:
      cloudflared:
        condition: service_started
    environment:
      <<: *sentry-environment
      DIAGNOSTIC_TARGET_URL: ${DIAGNOSTIC_TARGET_URL:-https://api.nursescheduling.org}
      DIAGNOSTIC_INFO_SAMPLES: ${DIAGNOSTIC_INFO_SAMPLES:-100}
      DIAGNOSTIC_PARALLEL_REQUESTS: ${DIAGNOSTIC_PARALLEL_REQUESTS:-10}
      DIAGNOSTIC_EXPECTED_CONCURRENCY: ${DIAGNOSTIC_EXPECTED_CONCURRENCY:-1}
      DIAGNOSTIC_MAX_JOBS: ${DIAGNOSTIC_MAX_JOBS:-128}
      DIAGNOSTIC_QUEUE_STABLE_SECONDS: ${DIAGNOSTIC_QUEUE_STABLE_SECONDS:-10}
      DIAGNOSTIC_WORKFLOW_TIMEOUT_SECONDS: ${DIAGNOSTIC_WORKFLOW_TIMEOUT_SECONDS:-600}
      DIAGNOSTIC_JOB_TIMEOUT_SECONDS: ${DIAGNOSTIC_JOB_TIMEOUT_SECONDS:-3600}
      DIAGNOSTIC_REPORT_DIR: /reports
      DIAGNOSTIC_AUTH_TOKEN: "${API_AUTH_TOKEN:-}"
    command: ["python", "-m", "nurse_scheduling.server.diagnostic"]
    volumes:
      - diagnostic-reports:/reports

volumes:
  diagnostic-reports:
