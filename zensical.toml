[project]
site_name = "Nurse Scheduling"
site_url = "https://nursescheduling.org/docs/"
site_description = "A user-friendly web app to automate the nurse scheduling task."
docs_dir = "docs/content"
site_dir = "site"
copyright = "Copyright &copy; 2023-2026 <a href=\"https://github.com/j3soon/nurse-scheduling\">Nurse Scheduling Contributors</a>"
repo_url = "https://github.com/j3soon/nurse-scheduling"
repo_name = "j3soon/nurse-scheduling"
extra_javascript = [
  "assets/javascripts/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]
nav = [
  { "Home" = "index.md" },
  { "Backend Server" = "backend-server.md" },
  { "Solvers" = "solvers.md" },
  { "Design" = "design.md" },
  "timeline.md",
]

[project.theme]
variant = "classic"
custom_dir = "docs/overrides"
favicon = "assets/images/favicon.png"
features = [
  "content.code.copy",
  "navigation.expand",
  "navigation.indexes",
  "toc.follow",
  "navigation.top",
  "search.suggest",
  "search.share",
  "header.autohide",
  "announce.dismiss",
]

[project.theme.icon]
logo = "material/file-document-outline"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.extra.analytics]
provider = "google"
property = "G-XGDWE4SWF7"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/j3soon/nurse-scheduling"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc = { permalink = true }
pymdownx.arithmatex = { generic = true }
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.critic = {}
pymdownx.details = {}
pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets = {}
pymdownx.superfences = {
  custom_fences = [
    {
      name = "mermaid",
      class = "mermaid",
      format = "pymdownx.superfences.fence_code_format",
    },
  ],
}
pymdownx.tabbed = { alternate_style = true }
pymdownx.tasklist = { custom_checkbox = true }
pymdownx.tilde = {}
mdx_truly_sane_lists = {}
