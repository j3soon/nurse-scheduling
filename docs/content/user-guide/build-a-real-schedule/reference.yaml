# Reference specification for the parts of the anonymized 87-person
# November 2025 ward schedule that the web app does not bulk-import.
#
# Bulk data is imported from the companion files in this directory:
#   people.txt                 87 person IDs
#   people-history.csv         previous-shift history (87 rows)
#   shift-requests-strong.csv  concrete person-date requests, weight 11000000000
#   shift-requests-moderate.csv  concrete person-date requests, weight 11000000
#
# Everything below is created through the UI, in the order listed, so the
# app's normalized YAML matches the bundled example. Weights of -inf / inf
# are entered with the -inf / inf controls (or +/- infinity buttons).
