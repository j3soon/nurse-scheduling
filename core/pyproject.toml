[project]
name = "nurse-scheduling"
version = "0.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Exclude legacy AI modules before import through tests/conftest.py.

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
extend-select = ["B904", "B905"]

[tool.ruff.lint.extend-per-file-ignores]
# Remove this exception with the legacy AI evaluation suite.
"tests/ai_eval/**" = ["B905"]

[tool.ty.src]
include = ["nurse_scheduling"]
# Remove each temporary exclusion as the file passes type checking.
exclude = [
    "nurse_scheduling/ai/agent.py",
    "nurse_scheduling/ai/agent_loop.py",
    "nurse_scheduling/ai/agent_session.py",
    "nurse_scheduling/ai/app.py",
    "nurse_scheduling/ai/chat_export.py",
    "nurse_scheduling/ai/chat_projection.py",
    "nurse_scheduling/ai/compaction.py",
    "nurse_scheduling/ai/context.py",
    "nurse_scheduling/ai/export_chat.py",
    "nurse_scheduling/ai/history.py",
    "nurse_scheduling/ai/litellm_concurrency.py",
    "nurse_scheduling/ai/optimizer.py",
    "nurse_scheduling/ai/provider.py",
    "nurse_scheduling/ai/recent_prompts.py",
    "nurse_scheduling/ai/recovery.py",
    "nurse_scheduling/ai/sandbox/command_output.py",
    "nurse_scheduling/ai/sandbox/e2b.py",
    "nurse_scheduling/ai/transcript.py",
    "nurse_scheduling/ai/validation.py",
    "nurse_scheduling/ai/workspace.py",
    "nurse_scheduling/ai/workspace_tools.py",
    "nurse_scheduling/sentry.py",
    "nurse_scheduling/solver_ortools_linear.py",
    "nurse_scheduling/solver_ortools_mathopt.py",
]
