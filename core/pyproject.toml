[project]
name = "nurse-scheduling"
version = "0.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Native tests/ai cases supersede these legacy prompt-evidence contracts.
# Remove these temporary exclusions in the dedicated legacy-removal branch.
addopts = [
    "--deselect=tests/test_ai_eval_optimizer_results.py::test_existing_evidence_survives_optional_case_fields",
    "--deselect=tests/test_ai_eval_runner.py::test_every_shipped_prompt_clause_has_current_repeated_benefit_evidence",
    "--deselect=tests/test_ai_eval_runner.py::test_reviewed_prompt_evidence_uses_portable_fixture_paths",
    "--deselect=tests/test_ai_eval_runner.py::test_optimizer_goal_and_background_start_have_separate_ladder_comparisons",
    "--deselect=tests/test_ai_eval_runner.py::test_prompt_evidence_accepts_only_cost_gains_meeting_the_declared_target",
    "--deselect=tests/test_ai_eval_runner.py::test_prompt_evidence_rejects_changed_helper_source",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
