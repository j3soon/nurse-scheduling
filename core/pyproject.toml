[project]
name = "nurse-scheduling"
version = "0.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Exclude legacy AI modules before import through tests/conftest.py.

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
extend-select = ["B904", "B905"]

[tool.ruff.lint.extend-per-file-ignores]
# Remove this exception with the legacy AI evaluation suite.
"tests/ai_eval/**" = ["B905"]

[tool.ty.src]
include = [
    "nurse_scheduling/ai/session_event_projection.py",
    "nurse_scheduling/ai/session_event_stream.py",
    "nurse_scheduling/ai/session_events.py",
    "nurse_scheduling/constants.py",
    "nurse_scheduling/context.py",
    "nurse_scheduling/errors.py",
    "nurse_scheduling/export_defaults.py",
    "nurse_scheduling/frontend_validation.py",
    "nurse_scheduling/loader.py",
    "nurse_scheduling/models.py",
    "nurse_scheduling/solver_interface.py",
    "nurse_scheduling/utils.py",
]
