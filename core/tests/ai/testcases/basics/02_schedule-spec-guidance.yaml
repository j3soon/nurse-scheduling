steps:
  - date: 2026-10-28T09:00:00+08:00
  - user: >-
      Build Schedule Spec for next month. People are P1-P10.
      A/D/E/N need 1/2/2/2 people daily. P1 is the head nurse and P2-P5 are
      seniors. No primary shifts, histories, requests or holiday import.
      Forbid N to D and N to E, limit consecutive workdays to five, and
      balance total days off and days off on free days equally across people.
  - schedule:
      allow_changes: true
  - optimizer:
      invoked: false
  - assistant:
      count: 3
      judge: |-
        Pass when the reply asks about (1) the head nurse's scheduling role,
        (2) senior staffing rules, and (3) shift eligibility.
        A combined question about the head nurse and seniors, with an example such as
        senior-only slots, satisfies all three. No additional head-nurse-specific question
        is required. Reject replies that omit either role, assume rules without asking,
        or only ask whether the head nurse counts as a senior. Rest or workload questions
        alone do not clarify staffing eligibility.
