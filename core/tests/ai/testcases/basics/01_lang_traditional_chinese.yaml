steps:
  - user: 你好
  - assistant:
      judge: >-
        Pass when the assistant replies in Traditional Chinese.
        Reject Simplified Chinese prose.
  - schedule:
      unchanged: true

  - user: 請簡短介紹你能幫我做什麼。
  - assistant:
      judge: >-
        Pass when the assistant replies in Traditional Chinese, matching the
        user's Traditional Chinese script. English app names and code identifiers
        are allowed.
  - schedule:
      unchanged: true

  - user: 请简短介绍你能帮我做什么。
  - assistant:
      judge: >-
        Pass when the assistant replies in Simplified Chinese, matching the
        user's clearly Simplified Chinese script. English app names and code
        identifiers are allowed.
  - schedule:
      unchanged: true
