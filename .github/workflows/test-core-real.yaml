name: Test Core Real Scenario

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_search:
        description: Run the slow search for a new real-world schedule
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-core-real:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: core/requirements*.txt
      - name: Install dependencies
        run: cd core && python -m pip install -r requirements-optional.txt
      - name: Replay the real-world assignment and verify its exact score
        working-directory: core
        run: pytest -q --durations=20 tests/real/schedule_score_ground_truth.py
      - name: Test real-world scenario until OR-Tools clears critical violations
        if: github.event_name == 'workflow_dispatch' && inputs.run_search
        run: cd core && pytest tests/real/schedule_ortools_cp_sat.py
      - name: Test bounded real-world scenario with CBC
        if: github.event_name == 'workflow_dispatch' && inputs.run_search
        run: cd core && pytest tests/real/schedule_pulp_cbc.py
      - name: Test bounded real-world scenario with cuOpt
        if: github.event_name == 'workflow_dispatch' && inputs.run_search
        run: cd core && pytest tests/real/schedule_pulp_cuopt.py
