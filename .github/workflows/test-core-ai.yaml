name: Test Core AI

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r core/requirements-optional.txt
      - name: Validate testcase definitions without credentials
        working-directory: core
        run: python -m tests.ai.runner validate
      - name: Test the parser, assertions, and runner
        working-directory: core
        run: pytest -q tests/test_ai_testcases.py

  behavior:
    needs: validate
    if: github.event_name == 'push' && github.repository == 'j3soon/nurse-scheduling'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: core-ai-${{ vars.E2B_TEMPLATE || 'nurse-scheduling-ai-sandbox-github-ci' }}
      cancel-in-progress: false
    env:
      E2B_TEMPLATE: ${{ vars.E2B_TEMPLATE || 'nurse-scheduling-ai-sandbox-github-ci' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r core/requirements-optional.txt
      - name: Build the CI sandbox template
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: python docker/e2b/build_template.py
      - name: Run human-reviewed AI conversations
        working-directory: core
        env:
          AI_PROVIDER_BASE_URL: ${{ secrets.AI_PROVIDER_BASE_URL }}
          AI_PROVIDER_API_KEY: ${{ secrets.AI_PROVIDER_API_KEY }}
          AI_PROVIDER_MODEL: ${{ vars.AI_PROVIDER_MODEL || 'unsloth/Qwen3.8-27B-NVFP4' }}
          AI_SANDBOX_BACKEND: e2b
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          AI_SANDBOX_TURN_TIMEOUT_SECONDS: "300"
        run: python -m tests.ai.runner run --diagnostic-attempts 3
