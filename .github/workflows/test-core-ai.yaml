name: Test Core AI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-validate
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.14"
          working-directory: core
          activate-environment: true
          cache-suffix: all-extras
      - name: Install dependencies
        working-directory: core
        run: uv sync --locked --all-extras
      - name: Validate testcase definitions without credentials
        working-directory: core
        run: python -m tests.ai.runner validate
      - name: Test the parser, assertions, and runner
        working-directory: core
        run: pytest -q tests/test_ai_testcases.py

  behavior:
    needs: validate
    if: >-
      github.repository == 'j3soon/nurse-scheduling' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: core-ai-${{ vars.E2B_TEMPLATE || 'nurse-scheduling-ai-sandbox-github-ci' }}
      cancel-in-progress: false
    env:
      E2B_TEMPLATE: ${{ vars.E2B_TEMPLATE || 'nurse-scheduling-ai-sandbox-github-ci' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.14"
          working-directory: core
          activate-environment: true
          cache-suffix: all-extras
      - name: Install dependencies
        working-directory: core
        run: uv sync --locked --all-extras
      - name: Build the CI sandbox template
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: python docker/e2b/build_template.py
      - name: Run human-reviewed AI conversations
        working-directory: core
        env:
          AI_PROVIDER_BASE_URL: ${{ secrets.AI_PROVIDER_BASE_URL }}
          AI_PROVIDER_API_KEY: ${{ secrets.AI_PROVIDER_API_KEY }}
          AI_PROVIDER_MODEL: ${{ vars.AI_PROVIDER_MODEL || 'unsloth/Qwen3.8-27B-NVFP4' }}
          AI_TEST_JUDGE_MODEL: ${{ vars.AI_TEST_JUDGE_MODEL }}
          AI_SANDBOX_BACKEND: e2b
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          AI_SANDBOX_TURN_TIMEOUT_SECONDS: "300"
        run: python -m tests.ai.runner run --diagnostic-attempts 3
      - name: Upload conversation transcripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-testcase-conversations
          path: artifacts/ai-testcases/
          if-no-files-found: ignore
