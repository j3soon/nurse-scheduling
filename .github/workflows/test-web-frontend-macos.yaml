name: Test Web Frontend macOS

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_coverage:
        description: Collect the slower minified-bundle coverage report
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-web-frontend-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        working-directory: web-frontend
        run: bun install --frozen-lockfile
      - name: Run tests with coverage
        working-directory: web-frontend
        run: bun run test:coverage
      - name: Upload frontend coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./web-frontend/coverage/lcov.info
          flags: web-frontend-macos
          name: web-frontend-vitest-macos

  test-web-frontend-e2e-macos:
    runs-on: macos-latest
    env:
      E2E_COVERAGE: ${{ inputs.bundle_coverage && '1' || '0' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        working-directory: web-frontend
        run: bun install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install core runtime for the export comparison
        run: python -m pip install -r core/requirements.txt
      - name: Install Playwright Chromium
        working-directory: web-frontend
        run: bunx playwright install chromium
      - name: Run Playwright tests
        working-directory: web-frontend
        run: bunx playwright test --workers=4 --reporter=dot --quiet --max-failures=1
      - name: Generate Playwright coverage report
        if: inputs.bundle_coverage
        working-directory: web-frontend
        run: bun run coverage:e2e:report
      - name: Upload Playwright coverage to Codecov
        if: inputs.bundle_coverage && github.event_name != 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./web-frontend/coverage-e2e/lcov.info
          flags: web-frontend-e2e-macos
          name: web-frontend-playwright-macos
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-macos
          path: |
            web-frontend/playwright-report
            web-frontend/test-results
            artifacts/chat-rendering
          if-no-files-found: ignore
