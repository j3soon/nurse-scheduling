name: Lint Core

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}
          working-directory: core
          activate-environment: true
          cache-suffix: lint
      - name: Install Ruff
        run: cd core && uv sync --locked --only-group lint
      - name: Check core Python formatting with Ruff
        run: cd core && ruff format --check nurse_scheduling tests
      - name: Lint core Python with Ruff
        run: cd core && ruff check nurse_scheduling tests
