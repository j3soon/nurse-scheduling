name: Test Web Frontend

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_coverage:
        description: Collect the slower minified-bundle coverage report
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-web-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install dependencies
        run: cd web-frontend && bun install --frozen-lockfile
      - name: Run tests with coverage
        run: cd web-frontend && bun run test:coverage
      - name: Upload frontend coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./web-frontend/coverage/lcov.info
          flags: web-frontend
          name: web-frontend-vitest

  test-web-frontend-e2e:
    runs-on: ubuntu-latest
    env:
      E2E_COVERAGE: ${{ inputs.bundle_coverage && '1' || '0' }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install dependencies
        run: cd web-frontend && bun install --frozen-lockfile
      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.12"
          working-directory: core
          activate-environment: true
          cache-suffix: runtime
      - name: Install core runtime for the export comparison
        working-directory: core
        run: uv sync --locked --no-dev
      - name: Install Playwright Chromium
        run: cd web-frontend && bunx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: cd web-frontend && bunx playwright test --reporter=dot --quiet --max-failures=1
      - name: Generate Playwright coverage report
        if: inputs.bundle_coverage
        run: cd web-frontend && bun run coverage:e2e:report
      - name: Upload Playwright coverage to Codecov
        if: inputs.bundle_coverage && github.event_name != 'pull_request'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./web-frontend/coverage-e2e/lcov.info
          flags: web-frontend-e2e
          name: web-frontend-playwright
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web-frontend/playwright-report
            web-frontend/test-results
            artifacts/chat-rendering
          if-no-files-found: ignore
