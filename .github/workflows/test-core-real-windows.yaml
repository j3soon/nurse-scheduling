name: Test Core Real Scenario Windows

on:
  push:
  pull_request:
  schedule:
    - cron: '7 4 * * 0'
  workflow_dispatch:
    inputs:
      run_search:
        description: Run the slow search for a new real-world schedule
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-core-real-windows:
    timeout-minutes: 25
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}
          working-directory: core
          activate-environment: true
          cache-suffix: all-extras
      - name: Install dependencies
        working-directory: core
        run: uv sync --locked --all-extras
      - name: Replay the real-world assignment and verify its exact score
        working-directory: core
        run: pytest -q --durations=20 tests/real/schedule_score_ground_truth.py
      - name: Test real-world scenario until OR-Tools clears critical violations
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_search)
        working-directory: core
        run: pytest tests/real/schedule_ortools_cp_sat.py
      - name: Test bounded real-world scenario with CBC
        if: github.event_name == 'workflow_dispatch' && inputs.run_search
        working-directory: core
        run: pytest tests/real/schedule_pulp_cbc.py
      - name: Test bounded real-world scenario with cuOpt
        if: github.event_name == 'workflow_dispatch' && inputs.run_search
        working-directory: core
        run: pytest tests/real/schedule_pulp_cuopt.py
