name: Test Core Windows

on:
  push:
  pull_request:
  schedule:
    - cron: '37 3 * * 0'
  workflow_dispatch:
    inputs:
      solver_profile:
        description: Solver regression coverage
        type: choice
        options: [primary, all]
        default: primary

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-core-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}
          working-directory: core
          activate-environment: true
          cache-suffix: all-extras
      - name: Install GLPK
        if: github.event_name == 'schedule' || inputs.solver_profile == 'all'
        run: choco install glpk --no-progress --yes
      - name: Install dependencies
        working-directory: core
        run: uv sync --locked --all-extras
      - name: Test with pytest and collect coverage
        working-directory: core
        run: pytest --cov=nurse_scheduling --durations=20 --solver-profile=${{ github.event_name == 'schedule' && 'all' || inputs.solver_profile || 'primary' }} tests --ignore=tests/test_schedule_pulp_cuopt.py
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: core-windows
          name: core-pytest-windows
