name: Check Vendor Integrity

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test integrity checker offline
        run: python -m unittest discover -s scripts -p test_check_vendor.py
      - name: Check bundled files offline
        run: python scripts/check_vendor.py
      - name: Compare with pinned upstream package
        run: python scripts/check_vendor.py --upstream
