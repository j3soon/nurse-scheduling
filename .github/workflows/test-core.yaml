name: Test Core

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      solver_profile:
        description: Solver regression coverage
        type: choice
        options: [primary, all]
        default: primary

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}
          working-directory: core
          activate-environment: true
          cache-suffix: all-extras
      - name: Test documentation link checker
        run: python -m unittest discover -s scripts -p test_check_docs_links.py
      - name: Test agent worktree helpers
        run: python -m unittest discover -s scripts -p test_add_worktree.py
      - name: Install workbook print test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc poppler-utils fonts-noto-cjk
      - name: Install GLPK
        if: github.event_name == 'schedule' || inputs.solver_profile == 'all'
        run: sudo apt-get install -y glpk-utils
      - name: Install dependencies
        run: cd core && uv sync --locked --all-extras
      - name: Type-check core modules
        run: cd core && ty check --python "$(command -v python)"
      - name: Test with pytest and collect coverage
        run: cd core && pytest --cov=nurse_scheduling --durations=20 --solver-profile=${{ github.event_name == 'schedule' && 'all' || inputs.solver_profile || 'primary' }} tests --ignore=tests/test_schedule_pulp_cuopt.py
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: core
          name: core-pytest
