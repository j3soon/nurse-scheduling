name: Test Core macOS

on:
  push:
  pull_request:
  schedule:
    - cron: '27 3 * * 0'
  workflow_dispatch:
    inputs:
      solver_profile:
        description: Solver regression coverage
        type: choice
        options: [primary, all]
        default: primary

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-core-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: core/requirements*.txt
      - name: Install GLPK
        if: github.event_name == 'schedule' || inputs.solver_profile == 'all'
        run: brew install glpk
      - name: Install dependencies
        working-directory: core
        run: python -m pip install -r requirements-optional.txt
      - name: Test with pytest and collect coverage
        working-directory: core
        run: >-
          pytest --cov=nurse_scheduling --durations=20 --solver-profile=${{ github.event_name == 'schedule' && 'all' || inputs.solver_profile || 'primary' }} tests
          --ignore=tests/test_schedule_pulp_cuopt.py
          --ignore=tests/test_schedule_pulp_highs.py
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: core-macos
          name: core-pytest-macos
